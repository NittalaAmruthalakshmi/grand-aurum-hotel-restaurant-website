<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Aurum – Owner Dashboard</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d1b16;--mut:#6d675a;--line:#e6dfcf;--gold:#b8892b;--ok:#2f8f5b;--bad:#c4452f;--warn:#d89a1c;--info:#2f6fb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--card:#201d17;--ink:#f3eee2;--mut:#a39b88;--line:#34301f;--gold:#d9aa4a;--ok:#4fc283;--bad:#ef6c55;--warn:#f0b43c;--info:#5aa0e6}}
:root[data-theme=dark]{--bg:#15130f;--card:#201d17;--ink:#f3eee2;--mut:#a39b88;--line:#34301f;--gold:#d9aa4a;--ok:#4fc283;--bad:#ef6c55;--warn:#f0b43c;--info:#5aa0e6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#17140e;color:#f3eee2;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font:600 20px Georgia,serif;color:#d9aa4a;margin:0 8px 4px}.sub{font-size:11px;letter-spacing:.15em;color:#a39b88;margin:0 8px 22px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfc8b5;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button.on,nav button:hover{background:#2a2518;color:#d9aa4a}
main{padding:26px;max-width:1200px;width:100%}
h1{font:600 26px Georgia,serif;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.mut{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font:600 26px Georgia,serif;margin-top:4px}.up{color:var(--ok)}.dn{color:var(--bad)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.room{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12px;background:var(--card);border-top-width:4px}
.room b{display:block;font-size:15px}.room.occupied{border-top-color:var(--bad)}.room.vacant{border-top-color:var(--ok)}.room.cleaning{border-top-color:var(--warn)}.room.maintenance{border-top-color:var(--mut)}
.lg span{display:inline-block;margin-right:14px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td.wrap{white-space:normal;min-width:220px}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.p-ok{background:var(--ok)}.p-bad{background:var(--bad)}.p-warn{background:var(--warn)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button.b{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button.s{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.t{border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;color:#fff}.t b{display:block;font-size:15px}
svg text{fill:var(--mut);font-size:11px}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(60,45,10,.06)}.kpi{border-left:3px solid var(--gold)}tr:hover td{background:rgba(184,137,43,.07)}aside{background:linear-gradient(180deg,#1b170f,#0f0d09)}nav button.on{box-shadow:inset 3px 0 0 #d9aa4a}label{font-size:13px;color:var(--mut)}button.b:hover{filter:brightness(1.1)}.room{transition:transform .12s}.room:hover{transform:translateY(-2px)}.room.sel{outline:2px solid var(--gold)}.room small{display:block;color:var(--mut);font-size:11px}.dot{display:inline-block;width:12px;height:12px;border:2px solid;margin-right:8px;border-radius:3px;vertical-align:-2px}.dot.v{border-color:#2f8f5b;background:radial-gradient(#2f8f5b 40%,transparent 45%)}.dot.n{border-color:#c4452f;background:radial-gradient(#c4452f 40%,transparent 45%)}.t{cursor:pointer}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:12px}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}.sub{display:none}main{padding:16px}}
</style></head><body>
<div class="app">
<aside><div class="logo">Grand Aurum</div><div class="sub">5★ HOTEL &amp; RESTAURANT</div><nav id="nav"></nav></aside>
<main><div class="top"><div><h1 id="ttl"></h1><div class="mut" id="dt"></div></div><div><button class="s" id="bell">🔔 Alerts <span id="bc" class="pill p-bad">0</span></button> <button class="s" id="th">🌓 Theme</button></div></div><div id="v"></div></main>
</div>
<script>
const $=s=>document.querySelector(s);
const fm=n=>n>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+" L":"₹"+n.toLocaleString("en-IN");
const G=["A. Mehta","R. Sharma","S. Iyer","K. Reddy","P. Nair","D. Khan","M. Rao","V. Singh","L. Patel","N. Das","T. Joshi","H. Gupta"];
function seed(){
 const T=[["Deluxe",9500],["Deluxe",9500],["Executive",14000],["Executive",14000],["Suite",26000]],rooms=[];
 for(let f=1;f<=5;f++)for(let n=1;n<=10;n++){const id=f*100+n,r=(id*37+f*11)%10;let s=r<6?"occupied":r==8?"cleaning":"vacant";if(id%23==0)s="maintenance";
  rooms.push({id,floor:f,type:T[f-1][0],rate:T[f-1][1],status:s,guest:s=="occupied"?G[id%12]:"",nights:s=="occupied"?(id%5)+1:0});}
 return{bk:defBk(),menu:defMenu(),rooms,
 months:["Jun","Jul","Aug","Sep","Oct","Nov"],
 rev:{Rooms:[3.8,4.1,4.4,4.7,5.2,5.8],Restaurant:[1.4,1.5,1.6,1.7,1.9,2.2],Banquet:[.9,.6,.8,1.1,1.5,2.1],Spa:[.4,.4,.5,.5,.6,.7]},
 exp:[{d:"2026-11-02",c:"Food & Beverage Purchase",t:"Vegetables, meat, dairy",a:1850000},{d:"2026-11-03",c:"Utilities",t:"Electricity & water",a:640000},{d:"2026-11-05",c:"Maintenance",t:"AC servicing, lifts",a:285000},{d:"2026-11-06",c:"Marketing",t:"Online booking ads",a:210000},{d:"2026-11-08",c:"Housekeeping Supplies",t:"Linen, toiletries",a:340000},{d:"2026-11-10",c:"Food & Beverage Purchase",t:"Imported items, wine",a:920000},{d:"2026-11-12",c:"Taxes & Licences",t:"Property tax, FSSAI",a:380000},{d:"2026-11-14",c:"Banquet Costs",t:"Decor, event rentals",a:450000}],
 staff:[
 ["Rakesh Verma","Management","General Manager",150000,"Day","Oversees all operations, guest escalations, budgets, owner reports"],
 ["Anita Desai","Front Office","Front Office Manager",80000,"Day","Manages reception, check-in/out, reservations, concierge team"],
 ["Suresh Babu","Front Office","Receptionist",32000,"Morning","Guest check-in/out, key cards, billing, phone enquiries"],
 ["Pooja Menon","Front Office","Receptionist",32000,"Night","Night audit, late arrivals, security coordination"],
 ["Kiran Raju","Housekeeping","Head Housekeeper",55000,"Day","Assigns rooms, quality inspection, linen and inventory"],
 ["Lakshmi Devi","Housekeeping","Room Attendant",22000,"Morning","Cleans guest rooms, restocks amenities, turndown service"],
 ["Ramesh Naik","Housekeeping","Room Attendant",22000,"Evening","Room cleaning, laundry handling, public area upkeep"],
 ["Chef Arjun Rao","Kitchen","Executive Chef",140000,"Day","Menu planning, food quality, kitchen cost control, team training"],
 ["Imran Sheikh","Kitchen","Sous Chef",75000,"Evening","Runs dinner service, prepares sauces and mains, hygiene checks"],
 ["Bhaskar Goud","Kitchen","Commis Cook",28000,"Morning","Prep work, cutting, breakfast buffet setup"],
 ["Divya Kumari","Restaurant","Restaurant Manager",70000,"Day","Floor management, reservations, guest feedback, staff rosters"],
 ["Vikram Singh","Restaurant","Captain",38000,"Evening","Takes orders, supervises waiters, handles VIP tables"],
 ["Sneha Reddy","Restaurant","Waiter",24000,"Evening","Serves food and drinks, table setup, order follow-up"],
 ["Mohan Lal","Restaurant","Bartender",36000,"Night","Prepares cocktails, bar stock, billing for bar"],
 ["Harish Kumar","Security","Security Supervisor",42000,"Night","CCTV, guard patrols, access control, emergency drills"],
 ["Yusuf Ali","Maintenance","Chief Engineer",65000,"Day","Electrical, plumbing, HVAC, generator and lift upkeep"],
 ["Meena Kapoor","Accounts","Accountant",52000,"Day","Daily revenue entry, payroll, vendor payments, GST filing"],
 ["Rohit Jain","Spa & Wellness","Spa Therapist",34000,"Day","Massage and wellness treatments, bookings, hygiene"]
 ].map((s,i)=>({id:i,name:s[0],dept:s[1],role:s[2],sal:s[3],shift:s[4],duty:s[5],paid:i%4!=0})),
 tables:Array.from({length:24},(_,i)=>({n:i+1,s:["occ","occ","free","res","occ","free"][(i*7+3)%6]})),
 dishes:[["Butter Chicken",64],["Hyderabadi Dum Biryani",58],["Wagyu Steak",31],["Truffle Pasta",27],["Paneer Tikka",49],["Chocolate Fondant",36]]};
}
let S;try{S=JSON.parse(localStorage.getItem("ga_s"))}catch(e){}
if(!S||!S.rooms)S=seed();if(!S.menu)S.menu=defMenu();if(!S.bk)S.bk=defBk();
const save=()=>{try{localStorage.setItem("ga_s",JSON.stringify(S))}catch(e){}};
const tabs=[["dash","Dashboard"],["rooms","Rooms"],["rest","Restaurant"],["menu","Menu"],["book","Bookings"],["rev","Revenue"],["exp","Expenses"],["staff","Staff & Duties"]];
let tab="dash",sel=null,fd="All",q="";
const payroll=()=>S.staff.reduce((a,s)=>a+s.sal,0);
const expTot=()=>S.exp.reduce((a,e)=>a+e.a,0);
const revM=i=>Object.values(S.rev).reduce((a,v)=>a+v[i]*1e6*1,0)*1;
const cnt=s=>S.rooms.filter(r=>r.status==s).length;
function bars(a,b,la,lb){const W=620,H=220,mx=Math.max(...a,...b)*1.15,bw=22;let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Chart">`;
 a.forEach((v,i)=>{const x=40+i*95,h=v/mx*160,h2=b[i]/mx*160;o+=`<rect x="${x}" y="${190-h}" width="${bw}" height="${h}" rx="3" fill="var(--gold)"/><rect x="${x+bw+4}" y="${190-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--bad)"/><text x="${x+bw}" y="208" text-anchor="middle">${S.months[i]}</text>`});
 return o+`<text x="40" y="14">■ ${la}  ■ ${lb}</text></svg>`}
const kpi=(l,v,x="")=>`<div class="card kpi"><span class="mut">${l}</span><b>${v}</b><span class="mut">${x}</span></div>`;
function dash(){const occ=cnt("occupied"),tot=S.rooms.length,rn=S.rooms.filter(r=>r.status=="occupied").reduce((a,r)=>a+r.rate,0);
 const rv=revM(5),ex=expTot()+payroll(),pf=rv-ex;
 const rvs=S.months.map((_,i)=>revM(i)/1e6),exs=rvs.map((v,i)=>i==5?ex/1e6:v*.62);
 return `<div class="grid k4">${kpi("Occupancy",Math.round(occ/tot*100)+"%",occ+" of "+tot+" rooms filled")}${kpi("Vacant rooms",cnt("vacant"),cnt("cleaning")+" cleaning · "+cnt("maintenance")+" maintenance")}${kpi("Revenue (Nov)",fm(rv),"Rooms, food, banquet, spa")}${kpi("Expenses (Nov)",fm(ex),"Incl. payroll "+fm(payroll()))}${kpi("Net profit",`<span class="${pf>=0?"up":"dn"}">${fm(pf)}</span>`,"Margin "+(pf/rv*100).toFixed(1)+"%")}${kpi("Today room income",fm(rn),"From occupied rooms")}${kpi("Restaurant tables",S.tables.filter(t=>t.s=="occ").length+" / "+S.tables.length,"currently occupied")}${kpi("Staff",S.staff.length,fm(payroll())+" monthly salary")}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h2>Revenue vs expenses (₹ millions)</h2>${bars(rvs,exs,"Revenue","Expenses")}</div><div class="card"><h2>Revenue by department (Nov)</h2>${Object.entries(S.rev).map(([k,v])=>`<div class="row" style="margin:0 0 10px;display:block"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${fm(v[5]*1e6)}</b></div><div class="bar"><i style="width:${v[5]*1e6/rv*100}%"></i></div></div>`).join("")}</div></div>`}
function rooms(){const fl=[1,2,3,4,5];
 const lg=`<div class="lg"><span><i style="background:var(--bad)"></i>Occupied ${cnt("occupied")}</span><span><i style="background:var(--ok)"></i>Vacant ${cnt("vacant")}</span><span><i style="background:var(--warn)"></i>Cleaning ${cnt("cleaning")}</span><span><i style="background:var(--mut)"></i>Maintenance ${cnt("maintenance")}</span></div>`;
 let h=`<div class="card" style="margin-bottom:14px">${lg}<p class="mut">Click any room to see guest details or change its status.</p>`;
 fl.forEach(f=>{h+=`<h2 style="margin-top:14px">Floor ${f} · ${S.rooms.find(r=>r.floor==f).type} · ${fm(S.rooms.find(r=>r.floor==f).rate)}/night</h2><div class="rooms">${S.rooms.filter(r=>r.floor==f).map(r=>`<div class="room ${r.status}" data-r="${r.id}"><b>${r.id}</b>${r.status}</div>`).join("")}</div>`});
 h+="</div>";
 if(sel){const r=S.rooms.find(x=>x.id==sel);h+=`<div class="card"><h2>Room ${r.id} · ${r.type}</h2><div class="row"><label>Status <select id="rst">${["occupied","vacant","cleaning","maintenance"].map(s=>`<option ${s==r.status?"selected":""}>${s}</option>`).join("")}</select></label><label>Guest <input id="rg" value="${r.guest}" placeholder="Guest name"></label><label>Nights <input id="rn" type="number" min="0" style="width:80px" value="${r.nights}"></label><button class="b" id="rsv">Save</button></div><div class="mut">Rate ${fm(r.rate)}/night${r.status=="occupied"?" · Bill so far "+fm(r.rate*r.nights):""}</div></div>`}
 return h}
function rest(){const occ=S.tables.filter(t=>t.s=="occ").length,col={occ:"var(--bad)",free:"var(--ok)",res:"var(--info)"},mx=Math.max(...S.dishes.map(d=>d[1]));
 return `<div class="grid k4">${kpi("Tables occupied",occ+" / "+S.tables.length)}${kpi("Reserved",S.tables.filter(t=>t.s=="res").length)}${kpi("Today restaurant sales",fm(286500),"142 covers")}${kpi("Avg bill per cover",fm(2017))}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h2>Table status</h2><div class="tbl">${S.tables.map(t=>`<div class="t" style="background:${col[t.s]}"><b>T${t.n}</b>${{occ:"Busy",free:"Free",res:"Booked"}[t.s]}</div>`).join("")}</div></div>
 <div class="card"><h2>Top dishes today (orders)</h2>${S.dishes.map(d=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${d[0]}</span><b>${d[1]}</b></div><div class="bar"><i style="width:${d[1]/mx*100}%"></i></div></div>`).join("")}</div></div>`}
function rev(){const keys=Object.keys(S.rev);return `<div class="card tw"><h2>Monthly revenue by department</h2><table><tr><th>Month</th>${keys.map(k=>`<th>${k}</th>`).join("")}<th>Total</th></tr>${S.months.map((m,i)=>`<tr><td>${m}</td>${keys.map(k=>`<td>${fm(S.rev[k][i]*1e6)}</td>`).join("")}<td><b>${fm(revM(i))}</b></td></tr>`).join("")}</table></div>
<div class="card" style="margin-top:14px"><h2>6-month trend (₹ millions)</h2>${bars(S.months.map((_,i)=>S.rev.Rooms[i]),S.months.map((_,i)=>S.rev.Restaurant[i]+S.rev.Banquet[i]+S.rev.Spa[i]),"Rooms","Other")}</div>`}
function exp(){const by={};S.exp.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);by["Staff Salaries"]=payroll();const tot=expTot()+payroll();
 return `<div class="grid k4">${kpi("Total expenses (Nov)",fm(tot))}${kpi("Staff salaries",fm(payroll()),Math.round(payroll()/tot*100)+"% of expenses")}${kpi("Other costs",fm(expTot()))}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h2>By category</h2>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${fm(v)}</b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div>`).join("")}</div>
 <div class="card"><h2>Add expense</h2><div class="row"><select id="ec">${["Food & Beverage Purchase","Utilities","Maintenance","Marketing","Housekeeping Supplies","Taxes & Licences","Banquet Costs","Other"].map(c=>`<option>${c}</option>`).join("")}</select><input id="et" placeholder="Description"><input id="ea" type="number" min="0" placeholder="Amount ₹" style="width:130px"><button class="b" id="eadd">Add</button></div></div></div>
 <div class="card tw" style="margin-top:14px"><h2>Expense ledger</h2><table><tr><th>Date</th><th>Category</th><th>Details</th><th>Amount</th><th></th></tr>${S.exp.map((e,i)=>`<tr><td>${e.d}</td><td>${e.c}</td><td>${e.t}</td><td>${fm(e.a)}</td><td><button class="s" data-x="${i}">Delete</button></td></tr>`).join("")}</table></div>`}
function staff(){const ds=["All",...new Set(S.staff.map(s=>s.dept))],L=S.staff.filter(s=>(fd=="All"||s.dept==fd)&&(s.name+s.role).toLowerCase().includes(q));
 const paid=S.staff.filter(s=>s.paid).reduce((a,s)=>a+s.sal,0);
 return `<div class="grid k4">${kpi("Total staff",S.staff.length)}${kpi("Monthly payroll",fm(payroll()))}${kpi("Salary paid",fm(paid),S.staff.filter(s=>s.paid).length+" staff")}${kpi("Salary pending",`<span class="dn">${fm(payroll()-paid)}</span>`,S.staff.filter(s=>!s.paid).length+" staff")}</div>
 <div class="card" style="margin-top:14px"><div class="row"><select id="fd">${ds.map(d=>`<option ${d==fd?"selected":""}>${d}</option>`).join("")}</select><input id="sq" placeholder="Search name or role" value="${q}"></div><div class="tw"><table><tr><th>Name</th><th>Department</th><th>Role</th><th>Shift</th><th>Salary/month</th><th>Duties</th><th>Status</th></tr>${L.map(s=>`<tr><td><b>${s.name}</b></td><td>${s.dept}</td><td>${s.role}</td><td>${s.shift}</td><td>${fm(s.sal)}</td><td class="wrap">${s.duty}</td><td><button class="s" data-p="${s.id}"><span class="pill ${s.paid?"p-ok":"p-bad"}">${s.paid?"Paid":"Pending"}</span></button></td></tr>`).join("")}</table></div></div>`}
function defMenu(){return "Starters|Paneer Tikka|650|1;Starters|Hara Bhara Kebab|580|1;Starters|Crispy Corn|520|1;Starters|Chicken 65|720|0;Starters|Galouti Kebab|890|0;Starters|Tandoori Prawns|1450|0;Starters|Fish Amritsari|980|0;Starters|Mutton Seekh Kebab|920|0;Soups & Salads|Tomato Basil Soup|380|1;Soups & Salads|Sweet Corn Soup|360|1;Soups & Salads|Chicken Manchow Soup|420|0;Soups & Salads|Caesar Salad|560|1;Soups & Salads|Greek Salad|540|1;Indian Mains|Butter Chicken|890|0;Indian Mains|Chicken Tikka Masala|860|0;Indian Mains|Mutton Rogan Josh|1150|0;Indian Mains|Andhra Gongura Mutton|1180|0;Indian Mains|Malabar Fish Curry|1050|0;Indian Mains|Dal Makhani|520|1;Indian Mains|Paneer Butter Masala|640|1;Indian Mains|Palak Paneer|620|1;Indian Mains|Kadai Vegetables|560|1;Biryani & Rice|Hyderabadi Chicken Dum Biryani|780|0;Biryani & Rice|Mutton Dum Biryani|980|0;Biryani & Rice|Veg Dum Biryani|620|1;Biryani & Rice|Jeera Rice|280|1;Biryani & Rice|Steamed Rice|240|1;Breads|Butter Naan|120|1;Breads|Garlic Naan|140|1;Breads|Tandoori Roti|80|1;Breads|Laccha Paratha|130|1;Breads|Stuffed Kulcha|150|1;Continental|Grilled Chicken Supreme|1250|0;Continental|Wagyu Beef Steak|3200|0;Continental|Pan-seared Salmon|2200|0;Continental|Herb Lamb Chops|2400|0;Continental|Truffle Mushroom Pasta|980|1;Continental|Penne Arrabbiata|820|1;Continental|Margherita Pizza|780|1;Desserts|Chocolate Fondant|520|1;Desserts|Gulab Jamun|320|1;Desserts|Rasmalai|380|1;Desserts|Tiramisu|480|1;Desserts|New York Cheesecake|460|1;Desserts|Kulfi Falooda|340|1;Beverages|Masala Chai|180|1;Beverages|Filter Coffee|200|1;Beverages|Fresh Lime Soda|220|1;Beverages|Mango Lassi|280|1;Beverages|Cold Coffee|320|1;Beverages|Fresh Juice|300|1;Beverages|Virgin Mojito|380|1;Beverages|Signature Cocktail|850|1;Beverages|Wine (glass)|950|1".split(";").map((r,i)=>{const p=r.split("|");return{id:i,c:p[0],n:p[1],p:+p[2],v:p[3]=="1",a:p[1]!="Tandoori Prawns"}})}
